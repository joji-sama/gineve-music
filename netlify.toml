# Static site — no build step. Netlify serves the repo root as-is.
# (This repo previously held a Next.js app; there is now no build.
#  In the Netlify UI, clear the Build command, set Publish directory to "."
#  and remove the @netlify/plugin-nextjs plugin if it is still listed.)
[build]
  publish = "."
  command = ""

# Long-cache immutable assets; HTML stays fresh.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
