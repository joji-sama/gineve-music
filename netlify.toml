# Static site — no build step. Netlify serves the repo root as-is.
# (This repo previously held a Next.js app; there is now no build.
#  In the Netlify UI, clear the Build command, set Publish directory to "."
#  and remove the @netlify/plugin-nextjs plugin if it is still listed.)
[build]
  publish = "."
  command = ""

# CSS/JS have stable filenames, so they must always be revalidated —
# the browser sends an If-None-Match and Netlify answers 304 when nothing
# changed (near-zero cost). Never mark an unversioned file "immutable".
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images: cached for a day. If you replace an image, either give it a new
# filename or add ?v=2 to its src so returning visitors pick it up at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
